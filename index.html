<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>D&D Guild System</title>

  <!-- <base href="/guild-system/"> -->

  <!-- MECHANICS: Main Game -->
  <link rel="stylesheet" href="Main/style.css">
  <script src="Main/app.js" defer></script>
  <script src="Main/dice.js" defer></script>

  <!-- MECHANICS: Player -->
  <script src="Player/playerStatus.js" defer></script>

  <!-- MECHANICS: Logs -->
  <a href="Logs/questLog.html">Quest Logs</a>

  <!-- GAME MODE: Premade Adventure -->
  <script src="Quests/missions.js" defer></script>  

  <!-- GAME MODE: Open World Adventure -->
  <script src="Quests/questScript.js" defer></script>  
  <link rel="stylesheet" href="Quests/questStyle.css">

</head>

<body>

<h1>🏛️ Online DM (D&D Campaign)</h1>

<div class="container">

  <div class="panel center-left">
    <h2>Guild Mission Board</h2>
    <button onclick="generateBoard()">Generate Missions</button>
    <div id="missions"></div>
  </div>

  <div class="panel right">

  <div class="dropdown">

    <div class="dropdown-header" onclick="toggleDropdown(this)">
      <h2>🧙 Quest Generator</h2>
      <span>▼</span>
    </div>

    <div class="dropdown-body">

      <label>Amount:</label>
      <input id="questCount" type="number" value="10" min="1" max="100">

      <button onclick="generateQuests()">Generate</button>
      <button onclick="clearQuests()">Clear</button>

      <div id="questList"></div>

    </div>

  </div>

</div>
  

  <!-- MISSIONS -->
  <!-- <div class="panel">
    <h2>Mission Board</h2>
    <button onclick="generateBoard()">Generate Missions</button>
    <div id="missions"></div>
  </div> -->

  <!-- 🔽 DROPDOWN -->
  <div class="dropdown">
    <div class="dropdown-body">

      <div class="panel">
        <h2>Generate Quests</h2>

        <label>Amount:</label>
        <input id="questCount" type="number" value="10" min="1" max="100">

        <button onclick="generateQuests()">Generate</button>
        <button onclick="clearQuests()">Clear</button>
      </div>

      <div class="panel">
        <h2>Quests</h2>
        <div id="questList"></div>
      </div>

    </div>
  </div> <!-- End of Dropdown -->

  <!-- PLAYER MODE -->
  <div class="stack left">

    <div class="panel">
      <h2>Mode</h2>
      <button onclick="setMode('solo')">Solo</button>
      <button onclick="setMode('party')">Party</button>
      <p id="modeDisplay"></p>
    </div>

    <div class="panel">
      <h2>Player Setup</h2>
      <div id="playerSetup"></div>
    </div>

  </div> <!-- End of Stack 1 -->
  
  <!-- PARTY / PLAYER DISPLAY (RPG CARDS GO HERE) -->

  <div class="panel center">
    <h2>Adventurers</h2>
    <!-- DRAG & DROP PARTY CONTAINER -->
    <div id="partyContainer"></div>
 
    <!-- SOLO PLAYER DISPLAY -->
    <div id="playerInfo"></div>
  </div> <!-- End of Panel Center -->
  

  <!-- DICE + HISTORY -->
  <div class="stack right">
    <!-- DICE -->
    <div class="panel">
      <h2>Roll Dice</h2>
      <select id="diceType">
        <option value="2">D2</option>
        <option value="4">D4</option>
        <option value="6" selected>D6</option>
        <option value="8">D8</option>
        <option value="10">D10</option>
        <option value="12">D12</option>
        <option value="20">D20</option>
        <option value="100">D100</option>
      </select>

      <input id="numDice" type="number" min="1" max="20" value="1">

      <button onclick="Dice.roll()">Roll</button>
    </div>

    <!-- HISTORY -->
    <div class="panel">
      <h2>History</h2>
      <div id="history"></div>
      <button onclick="Dice.clearHistory()">Clear</button>
    </div>
  </div>
  

</div>

</body>
</html>
