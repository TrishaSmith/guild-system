<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Guild System</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>

<h1>🏛️ Guild Mission Board</h1>

<div class="container">
  
  <div class="panel">
    <h2>Select Mode</h2>

    <button onclick="openSolo()">Solo Mode</button>
    <button onclick="openParty()">Party Mode</button>

    <div id="setupArea"></div>
  </div>

  <div class="panel">
    <h2>Mission Board</h2>
    <button onclick="generateBoard()">Generate Missions</button>
    <div id="missions"></div>
  </div>

  <div class="panel">
    <h2>Roll Dice</h2>

    <select id="diceType">
      <option value="2">D2</option>
      <option value="4">D4</option>
      <option value="6" selected>D6</option>
      <option value="8">D8</option>
      <option value="10">D10</option>
      <option value="12">D12</option>
      <option value="20">D20</option>
      <option value="100">D100</option>
    </select>

    <input id="numDice" type="number" min="1" max="20" value="1">

    <button onclick="rollDice()">Roll</button>

    <h3 id="result">Result: -</h3>
  </div>

  <div class="panel">
    <h2>History</h2>
    <div id="history"></div>
    <button onclick="clearHistory()">Clear</button>
  </div>
  
</div>

<script src="app.js"></script>
</body>
</html>
